# DiffSensei-main/layout-generator/configs/planner.yaml
model:
  type: .layout_encoder.TokenLayoutEncoder  
  parameters:
    max_elements: 90           # 与 collate 的 S_max 对齐
    d_model: 256
    num_layers: 6
    num_heads: 8
    use_positional_encoding: true
    use_final_ln: true
    dropout: 0.1

dataset:
  max_elements: 90
  parameters:
    max_panels: 30
    max_dialogs: 30
    max_characters: 30
    num_workers: 4
  train:
    data_path: "DiffSensei-main/checkpoints/mangazero/annotations_3200_4.json"
    image_dir: "DiffSensei-main/checkpoints/mangazero/images"
    text_encoder_path: "/data/model/clip-vit-large-patch14"
    max_num_samples: null
    specific_image_ids: [ ]
    shuffle: true
    batch_size: 4
    

training:
  epochs: 100
  lr: 1e-4
  weight_decay: 0.01
  clip_grad_norm: 1.0
  lambda_style: 20.0         # 风格损失权重
  lambda_geom: 20.0
  style_cfg_dropout: 0.1    # CFG 风格丢弃概率 p（训练时每样本独立丢弃风格）
  save_every: 100
  save_dir: "./checkpoints"


layout_types:
  TYPE_PAD: 0
  TYPE_PAGE: 1
  TYPE_PANEL: 2
  TYPE_CHAR: 3
  TYPE_DIALOG: 4

panel_shapes:
  panel_rect: {id: 0}
  panel_triangle: {id: 1}
  panel_trapezoid: {id: 2}
  panel_irregular_quad: {id: 3}

bubble_shapes:
  bubble_oval: {id: 0}
  bubble_flower: {id: 1}
  bubble_burst: {id: 2}
  bubble_rect: {id: 3}
